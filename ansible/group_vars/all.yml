---
# ===========================================================================
# EDIT THIS FILE FIRST. Everything else reads from here.
#
# This file holds USER-FACING variables. Role-internal lists (e.g. which base
# packages to install) live in the relevant roles/<role>/defaults/main.yml.
# ===========================================================================

# --- identity / locale -----------------------------------------------------
admin_user: borna                 # your sudo user on the nodes (break-glass login)
timezone: Europe/Zagreb           # change to yours

# Dedicated automation account. Created by the automation_user role; it exists
# so that key rotation and audit trails are separate from your human login.
# It is NOT less privileged than admin_user — Ansible needs root either way.
ansible_service_user: ansible

# Public half of the automation keypair, on THIS laptop. Generate with:
#   ssh-keygen -t ed25519 -f ~/.ssh/homelab_ansible -C "ansible@homelab"
ansible_service_pubkey: ~/.ssh/homelab_ansible.pub

# Users sshd will accept. Both must be listed BEFORE ansible_user is switched
# to the automation account, or the next run locks you out of every node.
ssh_allowed_users:
  - "{{ admin_user }}"
  - "{{ ansible_service_user }}"

# Who Ansible connects as.
#
# ROLLOUT — do these in order, verifying each step (see todos/001-*.md):
#   1. ssh-keygen (command above), so ansible_service_pubkey exists
#   2. `make nodes` as admin_user — creates the automation user, allows both in sshd
#   3. verify by hand:  ssh -i ~/.ssh/homelab_ansible ansible@node-1 sudo -n true
#   4. ONLY THEN swap the two lines below and re-run `make ping`
# ansible_user: "{{ admin_user }}"
ansible_user: "{{ ansible_service_user }}"
ansible_ssh_private_key_file: ~/.ssh/homelab_ansible

# --- networking ------------------------------------------------------------
# Derived from inventory ansible_host values — single source of truth.
# Kubernetes needs many ports open between nodes; trusting the peers wholesale
# is simpler and safer than hand-punching each port.
#
# These addresses are also what kubeadm and the kubelet advertise (see the
# --apiserver-advertise-address and --node-ip wiring), so they must be the
# addresses the nodes actually reach each other on. Set DHCP reservations.
node_ips: "{{ groups['k8s_cluster'] | map('extract', hostvars, 'ansible_host') | list }}"

# Inventory group names resolved to plain variables, ONCE, here.
#
# The roles consume these rather than referencing groups['...'] directly. Group
# names are inventory *data*; reaching for them inside a role hard-codes the
# shape of the inventory into the code, so the role can only ever drive an
# inventory that happens to use these exact group names. Keeping the lookup in
# one place also means renaming a group is a one-line change instead of a
# grep across seven roles.
#
# Override any of these to point a role at a differently-named group. The
# preflight role still asserts against the groups themselves — validating the
# inventory's shape is precisely its job.
control_plane_host: "{{ groups['control_plane'] | first }}"
worker_hosts: "{{ groups['workers'] | default([]) }}"
cluster_hosts: "{{ groups['k8s_cluster'] | default([]) }}"

# The worker that runs Prometheus, Grafana and the Prometheus Operator. Never
# the control plane: Prometheus TSDB compaction beside etcd's WAL causes fsync
# stalls. Effectively permanent once chosen, because Prometheus' local-path
# volume is bound to this node. Argo CD cannot read Ansible variables, so the
# same name is repeated as a nodeSelector in
# clusters/home/apps/kube-prometheus-stack.yaml — change both together.
monitoring_host: node-3

# Tailscale is a management path only. The auth key is a one-time bootstrap
# secret loaded explicitly from vars/tailscale.vault; it never belongs in
# this plaintext file. Once a node is enrolled, normal runs need no auth key.
tailscale_enabled: true
tailscale_cidr: 100.64.0.0/10
tailscale_udp_port: 41641

# Where SSH is allowed from. This also scopes the automation key's from=
# restriction, so the automation_user role must be re-run after this list
# changes.
ssh_allowed_from:
  - 192.168.178.0/24
  - "{{ tailscale_cidr }}"

# Application ingress stays LAN-only. Keeping this separate prevents enabling
# remote administration from silently exposing future HTTP services tailnet-wide.
ingress_allowed_from:
  - 192.168.178.0/24

# Clients that administer Kubernetes (the Ansible controller's Helm/kubectl)
# must reach the API server. Peer nodes already have full access through
# node_ips; this rule is rendered only on the control-plane host.
kubernetes_api_allowed_from:
  - 192.168.178.0/24

# MUST be a DNS name that resolves to the control-plane node. The nodes get an
# /etc/hosts entry automatically (base role); YOUR LAPTOP DOES NOT — run
# `make hosts` for the line to add, or `make status` will fail to resolve it.
# Using a NAME rather than an IP is what lets you add control-plane nodes
# later without regenerating certificates. Do not skip this.
control_plane_endpoint: k8s.home.arpa

# Pod network. Must NOT overlap your home LAN (192.168.178.0/24).
# kubeadm assigns a slice of this range to each node; Cilium consumes those
# PodCIDRs through Kubernetes host-scope IPAM. Do not change this to
# 192.168.x. The preflight role asserts this.
pod_cidr: "10.244.0.0/16"

# --- versions --------------------------------------------------------------
# CHECK THESE BEFORE YOUR FIRST RUN. Kubernetes/containerd were verified
# 2026-07-26; the Cilium release and chart digest were verified 2026-07-31;
# Tailscale 1.96.2 and its resolute signing key were verified 2026-08-01;
# MetalLB and Traefik release metadata were verified 2026-08-02/03;
# Metrics Server release metadata was verified 2026-08-06.
#   Kubernetes: https://kubernetes.io/releases/
#   Cilium:     https://github.com/cilium/cilium/releases
#   containerd: https://download.docker.com/linux/ubuntu/dists/resolute/stable/binary-amd64/Packages
#               (suite = the nodes' VERSION_CODENAME; the role builds the repo
#                line from ansible_distribution_release, so this URL must match
#                the nodes' actual release or the pin below will not resolve)
#
# Each artefact digest sits next to the version it belongs to. Regenerate a
# digest whenever you bump its version:
#   curl -fsSL <url> | sha256sum
kubernetes_minor: "1.36"                # used for the apt repo URL
kubernetes_apt_version: "1.36.3-1.1"    # exact pinned package version
# sha256 of https://pkgs.k8s.io/core:/stable:/v<minor>/deb/Release.key
# NOTE: this key is identical across minor versions (verified v1.34/1.35/1.36),
# so bumping kubernetes_minor does NOT require regenerating this digest.
kubernetes_key_sha256: "7627818cf7bae52f9008c93e8b1f961f53dea11d40891778de216fb1b43be54d"

# containerd comes from Docker's repo. Pinned and held: an unintended upgrade
# resets SystemdCgroup and breaks the kubelet without mentioning cgroups.
#
# The `~ubuntu.26.04~resolute` suffix is NOT cosmetic — Docker publishes a
# separately-versioned build per Ubuntu suite, and the role derives the repo line
# from ansible_distribution_release. A noble-suffixed pin against resolute nodes
# fails with "Version '...' for 'containerd.io' was not found", which reads like
# a missing package rather than a wrong release. Verified present in the
# resolute suite 2026-07-26. Bump this whenever the nodes' Ubuntu release changes.
containerd_apt_version: "2.2.6-1~ubuntu.26.04~resolute"
# sha256 of https://download.docker.com/linux/ubuntu/gpg
# This is a rotating aggregate keyring — if it changes legitimately this digest
# must be regenerated AND cross-checked against Docker's install docs.
docker_key_sha256: "1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570"

# Exact official package version. The amd64 .deb was independently verified as
# sha256 0431610d988ec54643a6beeae35f943aa3f11362577828138d367ca5aac29bc6.
# Installation still uses apt's repository signature plus the checksum-pinned
# signing key below as its trust boundary.
tailscale_apt_version: "1.96.2"

# sha256 of Tailscale's Ubuntu 26.04 package signing key:
# https://pkgs.tailscale.com/stable/ubuntu/resolute.noarmor.gpg
# Verified 2026-08-01; signing fingerprint:
# 2596 A99E AAB3 3821 893C 0A79 458C A832 957F 5868
tailscale_key_sha256: "3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39"

cilium_version: "1.20.0"
# OCI manifest digest reported by:
#   helm pull oci://quay.io/cilium/charts/cilium --version <version>
# The control-plane role installs through this digest rather than the mutable
# version tag, so the chart and its digest-pinned images are reproducible.
cilium_chart_sha256: "8009baed89d99fd84f7ee5cfdbf3a1fae8153452132549833956b6aca8b9d738"

# MetalLB supplies LAN addresses for Services of type LoadBalancer. The native
# manifest and both multi-architecture OCI image indexes were verified against
# the official 0.16.1 release on 2026-08-02.
metallb_version: "0.16.1"
# sha256 of the versioned native-mode installation manifest:
# https://raw.githubusercontent.com/metallb/metallb/v0.16.1/config/manifests/metallb-native.yaml
metallb_manifest_sha256: "bf25feebb7582ca7df845efd52ffbc2960d6cbf4cfc972f47fded9f788b67f0b"
# Multi-architecture OCI index digests reported by:
#   docker buildx imagetools inspect quay.io/metallb/<image>:v0.16.1
metallb_controller_image_sha256: "f51ab515de9ccd20dc3dccb093e48df8adddac019326c456f449e55ba91b6420"
metallb_speaker_image_sha256: "16561e96531e1852d5c229ad7fae6e994dcfa983ff7f4de6b6208b34a4e2ddbc"

# The FRITZ!Box DHCP pool is 192.168.178.20-192.168.178.200 (confirmed
# 2026-08-02). Keep LoadBalancer addresses above it and below the broadcast
# address; this range also avoids the router (.1) and all three node addresses.
metallb_address_pool_state: present
metallb_address_pool_confirmed: true
metallb_address_ranges:
  - 192.168.178.240-192.168.178.250

# Traefik is the cluster's minimal HTTP ingress controller. The chart metadata
# pins proxy v3.7.6, and both the chart and multi-architecture image indexes are
# selected by immutable OCI digests rather than mutable version tags.
traefik_chart_version: "41.0.2"
# OCI manifest digest reported by:
#   helm show chart oci://ghcr.io/traefik/helm/traefik --version 41.0.2
traefik_chart_sha256: "b64212403e056c14dbcac5bfd0030f89f0e08fccae370dd7cd96592ee745848e"
traefik_version: "3.7.6"
# Multi-architecture OCI index digest reported by:
#   docker buildx imagetools inspect traefik:v3.7.6
traefik_image_sha256: "21a3d83696379bac6434bb32e1dde0aff0e84ef2abd053ed3db87d3f45e749b2"

# This address is inside lan-pool but outside the FRITZ!Box DHCP range. MetalLB
# makes it reachable; Traefik listens behind it and routes HTTP by Ingress rule.
traefik_load_balancer_ip: 192.168.178.240

# Metrics Server is the first observability rung: current CPU and memory through
# metrics.k8s.io and `kubectl top`, with no history, dashboards, alerts, or logs.
# The official release manifest and multi-architecture image index were verified
# on 2026-08-06.
metrics_server_version: "0.9.0"
# sha256 of the versioned release manifest:
# https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
metrics_server_manifest_sha256: "1cec29a5267809306a2c6ec74a3e449abbb705b4a8beed0c8a1963910f72c79b"
# Multi-architecture OCI index digest reported by:
#   docker buildx imagetools inspect registry.k8s.io/metrics-server/metrics-server:v0.9.0
metrics_server_image_sha256: "d9862115e7c7881280d3d75ca26bda8ffc0fc213315979575bf23ce9826205c0"

# kubeadm currently gives kubelets self-signed serving certificates. This
# explicit acknowledgement permits --kubelet-insecure-tls for this private,
# trusted-node first rung only. Replace it with signed kubelet certificates and
# remove the APIService TLS skip before running untrusted sandbox workloads.
metrics_server_kubelet_insecure_tls_acknowledged: true

# --- storage ---------------------------------------------------------------
# local-path-provisioner supplies the default StorageClass. Release, manifest
# and both image indexes were verified on 2026-10-10. v0.0.37 uses only GA
# APIs (core, rbac, apps, storage v1), so it is not tied to a Kubernetes minor.
#   https://github.com/rancher/local-path-provisioner/releases
local_path_provisioner_version: "0.0.37"
# sha256 of the manifest at that tag (git tags are mutable; this pin is not):
# https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml
local_path_provisioner_manifest_sha256: "9781b39c24f3f651bd6d6e41b561e04e4904bbdb6d4f8c7a6009df3a702dcd65"
# Multi-architecture OCI index digests reported by:
#   docker buildx imagetools inspect docker.io/rancher/local-path-provisioner:v0.0.37
#   docker buildx imagetools inspect docker.io/library/busybox:1.38.0
local_path_provisioner_image_sha256: "e757967a5ec338f6a9b371c5a9688bedaa8c3578ea3dd4db329ea0084be0a86f"
# Upstream ships the volume helper pod as bare, untagged busybox.
local_path_provisioner_helper_image_version: "1.38.0"
local_path_provisioner_helper_image_sha256: "fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e"

# Where PVs are created on each worker. The workers have a single 100G root LV
# (87G free when checked 2026-10-10; ~135G of the VG is still unallocated), so
# this shares a filesystem with /var/lib/containerd. PVC sizes are NOT
# enforced — Prometheus retentionSize and a disk alert are the real limits.
local_path_provisioner_data_path: "/var/lib/local-path-provisioner"

# The helper pod gets root hostPath write access to the data path above on
# every worker — a deliberate exception to the hardening posture. Read the
# role README before setting this.
local_path_provisioner_hostpath_acknowledged: true

# Argo CD is the GitOps controller for everything under clusters/home/. Ansible
# owns the Argo CD release itself (it never manages its own installation).
# Chart 10.10.2 ships Argo CD v3.5.4, tested upstream on Kubernetes 1.33–1.36.
# Release metadata and digests were verified 2026-10-10.
argocd_chart_version: "10.10.2"
# OCI manifest digest reported by:
#   helm pull oci://ghcr.io/argoproj/argo-helm/argo-cd --version 10.10.2
argocd_chart_sha256: "96ff0d2150557ceb51c309c3adedb63455226c2dd2c5323f5b1e894536e2901d"
argocd_version: "3.5.4"
# Multi-architecture index digests reported by:
#   docker buildx imagetools inspect quay.io/argoproj/argocd:v3.5.4
#   docker buildx imagetools inspect ecr-public.aws.com/docker/library/redis:8.6.4-alpine
# The Redis tag is the one the chart itself defaults to; bump it with the chart.
argocd_image_sha256: "49dff79439bb38b1b942b19a113fe1fec7e6b6c671ddf9fe6a4a7c46bde0b77b"
argocd_redis_version: "8.6.4-alpine"
argocd_redis_image_sha256: "2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763"
# Public repository, so Argo CD reads it anonymously. Never embed credentials.
argocd_root_repo_url: "https://github.com/bornakapusta/homelab.git"

# base_packages moved to roles/base/defaults/main.yml — it is a property of the
# base role, not a site setting. Override it here only if you need extras.
