---
# ===========================================================================
# platform.yml — bootstrap cluster services needed before Argo CD exists.
#
#   ansible-playbook platform.yml
#
# MetalLB is installed first and its address pool is reconciled only after the
# explicit safety gate in group_vars/all.yml confirms the router's DHCP boundary.
# Traefik then requests one fixed address from that pool for HTTP ingress.
# local-path-provisioner adds the worker-only default StorageClass that every
# PVC (Prometheus first) depends on.
# Metrics Server finally adds current CPU/memory through the aggregated API;
# it does not depend on the LAN address pool or ingress.
# Argo CD comes last: it needs Traefik for its UI, and from then on it owns
# everything declared under clusters/home/ through one root Application.
# ===========================================================================

- name: Bootstrap cluster platform services
  hosts: control_plane
  gather_facts: false
  become: false
  any_errors_fatal: true
  roles:
    - role: metallb
      tags: [platform, metallb]
    - role: traefik
      tags: [platform, traefik, ingress]
    - role: local_path_provisioner
      tags: [platform, storage]
    - role: metrics_server
      tags: [platform, metrics, observability]
    - role: argocd
      tags: [platform, argocd, gitops]
