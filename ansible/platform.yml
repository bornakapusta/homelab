---
# ===========================================================================
# platform.yml — bootstrap cluster services needed before Argo CD exists.
#
#   ansible-playbook platform.yml
#
# MetalLB is installed first and its address pool is reconciled only after the
# explicit safety gate in group_vars/all.yml confirms the router's DHCP boundary.
# Traefik then requests one fixed address from that pool for HTTP ingress.
# ===========================================================================

- name: Bootstrap cluster platform services
  hosts: control_plane
  gather_facts: false
  become: false
  any_errors_fatal: true
  roles:
    - role: metallb
      tags: [platform, metallb]
    - role: traefik
      tags: [platform, traefik, ingress]
