# ---------------------------------------------------------------------------
# Your three nodes. Addresses confirmed reachable 2026-07-26; all three are
# running Ubuntu 26.04 (resolute) on x86_64 with hostnames already set.
#
# These addresses are load-bearing beyond SSH: node_ips (ufw peer rules), the
# /etc/hosts entry for control_plane_endpoint, the kubelet's --node-ip, and
# kubeadm's --apiserver-advertise-address all derive from them. The advertise
# address is baked into the apiserver certificate, so once the cluster is
# bootstrapped an address change means `kubeadm reset` on every node.
#
# SET DHCP RESERVATIONS in the Fritz!Box for all three so they never move.
# They are not in a contiguous range, which suggests they are still dynamic
# leases rather than reservations — fix that before running `make cluster`.
#
# Stage A (now):      1 control-plane + 2 workers
# Stage B (later):    move node-2 and node-3 into [control_plane] as well,
#                     after setting up kube-vip. Never stop at exactly 2.
# ---------------------------------------------------------------------------

[control_plane]
node-1 ansible_host=192.168.178.11

[workers]
node-2 ansible_host=192.168.178.44
node-3 ansible_host=192.168.178.66

# Convenience group: every machine in the cluster
[k8s_cluster:children]
control_plane
workers
