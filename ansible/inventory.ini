# ---------------------------------------------------------------------------
# Your three nodes. CHANGE THE IPs to match your DHCP reservations.
#
# Stage A (now):      1 control-plane + 2 workers
# Stage B (later):    move node-2 and node-3 into [control_plane] as well,
#                     after setting up kube-vip. Never stop at exactly 2.
# ---------------------------------------------------------------------------

[control_plane]
node-1 ansible_host=192.168.178.26

[workers]
# TODO: confirm these once nodes 2 and 3 are installed.
# Set DHCP reservations in the Fritz!Box for all three so they never move.
node-2 ansible_host=192.168.178.27
node-3 ansible_host=192.168.178.28

# Convenience group: every machine in the cluster
[k8s_cluster:children]
control_plane
workers
