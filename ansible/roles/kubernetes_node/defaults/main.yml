---
# Defaults for the kubernetes_node role. Required vars come from
# group_vars/all.yml and are asserted by the preflight role:
# kubernetes_minor: (required) e.g. "1.36" — used for the apt repo URL
# kubernetes_apt_version: (required) e.g. "1.36.3-1.1"
# kubernetes_key_sha256: (required) digest of the k8s apt signing key
# containerd_apt_version: (required) e.g. "2.2.6-1~ubuntu.26.04~resolute"
# docker_key_sha256: (required) digest of the Docker apt signing key

# Packages managed as persistent apt holds so an unrelated patch run cannot
# break the cluster. Exact-version installs use allow_change_held_packages
# instead of an unhold phase. containerd.io is re-held immediately after its
# install, and this complete list is re-held at role end as a repair/safety step.
kubernetes_node_managed_held_packages:
  - kubelet
  - kubeadm
  - kubectl
  - containerd.io
