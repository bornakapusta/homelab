---
# Defaults for the hardening role. No values on purpose — a plausible-looking
# default for any of these would silently harden the wrong thing. The preflight
# role asserts they are set. All come from group_vars/all.yml:
#
# ssh_allowed_users: (required) sshd AllowUsers — must include the connecting user
# node_ips: (required) peer addresses trusted wholesale by ufw
# ssh_allowed_from: (required) source networks for SSH
# ingress_allowed_from: (required) source networks for ingress 80/443
# kubernetes_api_allowed_from: (required) source networks for API port 6443
# control_plane_host: (required) only this host receives the API rule
# pod_cidr: (required) in-cluster clients allowed to reach API port 6443
# tailscale_enabled: (required) whether tailnet-specific rules are active
# tailscale_cidr: (required) canonical tailnet source range
# tailscale_udp_port: (required) tailscaled direct-connection transport port
