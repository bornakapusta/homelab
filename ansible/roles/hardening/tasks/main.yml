---
# SSH lockdown, host firewall, automatic security patching.
# See linux-k8s-foundations.md §3 for the reasoning behind each choice.

# --- SSH -------------------------------------------------------------------
# A drop-in file is cleaner than editing sshd_config; Ubuntu 26.04 includes
# /etc/ssh/sshd_config.d/*.conf by default.
- name: Harden sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
    # backup matters most on this file and on the sudoers drop-in: a bad write to
    # either locks every node at once. The backup lands beside it as
    # 99-hardening.conf.<pid>.<date>~, which sshd's `Include *.conf` does not
    # match, so the old copy is readable from the console without being loaded.
    backup: true
    content: |
      {{ __hardening_managed_header }}
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
      PermitEmptyPasswords no
      MaxAuthTries 3
      LoginGraceTime 30
      ClientAliveInterval 300
      ClientAliveCountMax 2
      AllowAgentForwarding no
      # Both the human login and the automation account. Dropping either one
      # locks that account out of every node on the next reload — the preflight
      # role asserts that the connecting user is in this list.
      AllowUsers {{ ssh_allowed_users | join(' ') }}
  notify: Reload sshd

- name: Validate sshd config before we rely on it
  ansible.builtin.command: sshd -t
  changed_when: false

# --- Firewall --------------------------------------------------------------
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

# CRITICAL for Kubernetes: ufw defaults to DROP on the FORWARD chain, which
# silently breaks pod-to-pod networking. This one line saves hours.
- name: Allow forwarded traffic (required for pod networking)
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
    # This file is shipped by the ufw package and edited in place rather than
    # replaced, so the backup is the only record of what the distribution's
    # default was.
    backup: true
  notify: Reload ufw

- name: Default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

# Kubernetes uses a wide range of inter-node ports (apiserver 6443,
# etcd 2379-2380, kubelet 10250, NodePorts 30000-32767, plus CNI).
# Trusting the peer IPs wholesale is simpler and less fragile.
- name: Trust every other node completely
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
  loop: "{{ node_ips }}"

# Helm and kubectl run on the Ansible controller, not on a peer node. Without a
# separate client rule, kubeadm succeeds but the controller times out when it
# tries to install the CNI through the API server.
- name: Allow Kubernetes API clients on the control plane
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    port: "6443"
    proto: tcp
  loop: "{{ kubernetes_api_allowed_from }}"
  when: inventory_hostname == control_plane_host

# In-cluster clients reach the API through its ClusterIP. kube-proxy DNATs
# that traffic to this host's LAN address while preserving the Pod source IP,
# so it traverses UFW's INPUT chain rather than only its FORWARD chain.
- name: Allow the Pod network to reach the Kubernetes API on the control plane
  community.general.ufw:
    rule: allow
    src: "{{ pod_cidr }}"
    port: "6443"
    proto: tcp
  when: inventory_hostname == control_plane_host

# Prometheus runs with hostNetwork on monitoring_host, so its scrapes leave from
# that node's trusted LAN address and no kubelet/node-exporter port has to be
# opened to the Pod network (same reasoning as metrics_server). The one cost:
# Grafana, an ordinary Pod, reaches Prometheus at that host's address with its
# Pod source IP, which lands in UFW's INPUT chain like the API rule above.
- name: Allow the Pod network to reach Prometheus on the monitoring host
  community.general.ufw:
    rule: allow
    src: "{{ pod_cidr }}"
    port: "9090"
    proto: tcp
  when: inventory_hostname == monitoring_host

- name: Allow SSH from approved networks
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    port: "22"
    proto: tcp
  # The tailnet receives its own interface-bound rule below. Never render its
  # source CIDR as a generic rule: source-only matching would also trust spoofed
  # packets that arrive on a LAN interface.
  loop: "{{ ssh_allowed_from | reject('equalto', tailscale_cidr) | list }}"

# Older runs created a source-only tailnet SSH rule. Removing the CIDR from the
# loop above does not remove that persistent UFW entry, so delete the exact
# legacy contract before installing the interface-bound replacement.
- name: Delete the legacy generic tailnet SSH rule
  community.general.ufw:
    rule: allow
    src: "{{ tailscale_cidr }}"
    port: "22"
    proto: tcp
    delete: true

- name: Allow SSH from the tailnet only on tailscale0
  community.general.ufw:
    rule: allow
    interface_in: tailscale0
    src: "{{ tailscale_cidr }}"
    port: "22"
    proto: tcp
  when: tailscale_enabled | bool

# With Tailscale netfilter management disabled, UFW must admit the daemon's
# public UDP transport port so peers can establish direct WireGuard paths.
- name: Allow the Tailscale UDP transport port
  community.general.ufw:
    rule: allow
    port: "{{ tailscale_udp_port }}"
    proto: udp
  when: tailscale_enabled | bool

# Removing a source from an Ansible loop does not remove the UFW rules created
# by an older run. Delete the exact legacy tailnet web rules before managing the
# current LAN-only ingress set.
- name: Delete legacy tailnet HTTP and HTTPS rules
  community.general.ufw:
    rule: allow
    src: "{{ tailscale_cidr }}"
    port: "{{ item }}"
    proto: tcp
    delete: true
  loop:
    - "80"
    - "443"

- name: Allow HTTP/HTTPS from approved ingress networks
  community.general.ufw:
    rule: allow
    src: "{{ item.0 }}"
    port: "{{ item.1 }}"
    proto: tcp
  loop: "{{ ingress_allowed_from | product(['80', '443']) | list }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled

# --- Automatic security updates -------------------------------------------
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable automatic security updates only
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    # apt skips files ending in `~`, so the backup is inert where it lands.
    backup: true
    content: |
      {{ __hardening_managed_header }}
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

# Never let the cluster reboot itself — you drain a node first, by hand.
- name: Disable automatic reboots
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51-no-auto-reboot
    owner: root
    group: root
    mode: "0644"
    backup: true
    content: |
      {{ __hardening_managed_header }}
      Unattended-Upgrade::Automatic-Reboot "false";
      // Kubernetes packages are version-held; never let them auto-upgrade.
      Unattended-Upgrade::Package-Blacklist {
          "kubelet";
          "kubeadm";
          "kubectl";
          "containerd.io";
      };
