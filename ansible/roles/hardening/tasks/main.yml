---
# SSH lockdown, host firewall, automatic security patching.
# See linux-k8s-foundations.md §3 for the reasoning behind each choice.

# --- SSH -------------------------------------------------------------------
# A drop-in file is cleaner than editing sshd_config; Ubuntu 26.04 includes
# /etc/ssh/sshd_config.d/*.conf by default.
- name: Harden sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
    # backup matters most on this file and on the sudoers drop-in: a bad write to
    # either locks every node at once. The backup lands beside it as
    # 99-hardening.conf.<pid>.<date>~, which sshd's `Include *.conf` does not
    # match, so the old copy is readable from the console without being loaded.
    backup: true
    content: |
      {{ __hardening_managed_header }}
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
      PermitEmptyPasswords no
      MaxAuthTries 3
      LoginGraceTime 30
      ClientAliveInterval 300
      ClientAliveCountMax 2
      AllowAgentForwarding no
      # Both the human login and the automation account. Dropping either one
      # locks that account out of every node on the next reload — the preflight
      # role asserts that the connecting user is in this list.
      AllowUsers {{ ssh_allowed_users | join(' ') }}
  notify: Reload sshd

- name: Validate sshd config before we rely on it
  ansible.builtin.command: sshd -t
  changed_when: false

# --- Firewall --------------------------------------------------------------
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

# CRITICAL for Kubernetes: ufw defaults to DROP on the FORWARD chain, which
# silently breaks pod-to-pod networking. This one line saves hours.
- name: Allow forwarded traffic (required for pod networking)
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
    # This file is shipped by the ufw package and edited in place rather than
    # replaced, so the backup is the only record of what the distribution's
    # default was.
    backup: true
  notify: Reload ufw

- name: Default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

# Kubernetes uses a wide range of inter-node ports (apiserver 6443,
# etcd 2379-2380, kubelet 10250, NodePorts 30000-32767, plus CNI).
# Trusting the peer IPs wholesale is simpler and less fragile.
- name: Trust every other node completely
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
  loop: "{{ node_ips }}"

- name: Allow SSH from approved networks
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    port: "22"
    proto: tcp
  loop: "{{ ssh_allowed_from }}"

- name: Allow HTTP/HTTPS for ingress (LAN only until ingress controller is deployed)
  community.general.ufw:
    rule: allow
    src: "{{ item.0 }}"
    port: "{{ item.1 }}"
    proto: tcp
  loop: "{{ ssh_allowed_from | product(['80', '443']) | list }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled

# --- Automatic security updates -------------------------------------------
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable automatic security updates only
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    # apt skips files ending in `~`, so the backup is inert where it lands.
    backup: true
    content: |
      {{ __hardening_managed_header }}
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

# Never let the cluster reboot itself — you drain a node first, by hand.
- name: Disable automatic reboots
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51-no-auto-reboot
    owner: root
    group: root
    mode: "0644"
    backup: true
    content: |
      {{ __hardening_managed_header }}
      Unattended-Upgrade::Automatic-Reboot "false";
      // Kubernetes packages are version-held; never let them auto-upgrade.
      Unattended-Upgrade::Package-Blacklist {
          "kubelet";
          "kubeadm";
          "kubectl";
          "containerd.io";
      };
