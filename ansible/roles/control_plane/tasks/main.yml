---
# kubeadm init + Cilium CNI + kubeconfig distribution.

- name: Read the controller Helm version
  ansible.builtin.command: helm version --short
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  register: __control_plane_helm_version
  failed_when: false
  changed_when: false

- name: Normalise the controller Helm version
  ansible.builtin.set_fact:
    __control_plane_helm_semver: >-
      {{ __control_plane_helm_version.stdout
         | default('v0.0.0', true)
         | regex_replace('^v', '')
         | regex_replace('\+.*$', '') }}
  run_once: true

- name: Controller Helm must support the pinned Kubernetes release
  ansible.builtin.assert:
    that:
      - __control_plane_helm_version.rc == 0
      - __control_plane_helm_semver is version('4.2.0', '>=')
      - __control_plane_helm_semver is version('5.0.0', '<')
    fail_msg: >-
      Kubernetes 1.36 needs Helm 4.2.x according to Helm's version-skew policy,
      and this role deliberately fails closed on unreviewed major versions.
      Install or upgrade Helm on the Ansible controller, then re-run `make
      cluster`.
    quiet: true
  delegate_to: localhost
  become: false
  run_once: true

- name: Check whether the cluster is already initialised
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: __control_plane_admin_conf

- name: Verify the Cilium chart before initialising a new cluster
  ansible.builtin.include_tasks: verify_cilium_chart.yml
  when: not __control_plane_admin_conf.stat.exists

# --control-plane-endpoint is the important flag: it puts a NAME (not this
# node's IP) in the certificates, which is what allows extra control-plane
# nodes to be added later without regenerating everything.
#
# --apiserver-advertise-address pins the API server to the address the rest of
# this repo uses (ufw peer rules, the /etc/hosts endpoint mapping). These nodes
# are multi-homed (WiFi + Ethernet), so leaving kubeadm to infer it can pick the
# wrong interface. Baked into the cert — cannot be changed without a reset.
#
# --skip-token-print instead of no_log: the bootstrap token is the only secret in
# this command's output, and the join command is regenerated further down anyway,
# so removing the secret at the source beats hiding the whole result. no_log here
# used to censor failures too, leaving the single most failure-prone task in the
# repo with no diagnostics at all.
- name: Initialise the control plane
  ansible.builtin.command: >
    kubeadm init
    --control-plane-endpoint={{ control_plane_endpoint }}
    --apiserver-advertise-address={{ ansible_host }}
    --apiserver-cert-extra-sans={{ ansible_host }},{{ control_plane_endpoint }}
    --pod-network-cidr={{ pod_cidr }}
    --node-name={{ inventory_hostname }}
    --skip-token-print
  when: not __control_plane_admin_conf.stat.exists
  register: __control_plane_kubeadm_init
  changed_when: __control_plane_kubeadm_init.rc == 0

# --- kubeconfig for the admin user on the node -----------------------------
- name: Create .kube directory for {{ admin_user }}
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.kube"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"

- name: Copy admin kubeconfig for {{ admin_user }}
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ admin_user }}/.kube/config"
    remote_src: true
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"

- name: Fetch kubeconfig to your laptop (./kubeconfig)
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ playbook_dir }}/kubeconfig"
    flat: true

- name: Restrict kubeconfig permissions on localhost
  ansible.builtin.file:
    path: "{{ playbook_dir }}/kubeconfig"
    mode: "0600"
  delegate_to: localhost
  become: false

# --- Cilium CNI ------------------------------------------------------------
# Nodes stay NotReady until a CNI is running. Helm runs on the controller using
# the fetched kubeconfig and the node's direct IP, so initial bootstrap does not
# depend on laptop DNS already resolving control_plane_endpoint.
- name: Detect a legacy Calico installation
  ansible.builtin.command: kubectl -n kube-system get daemonset calico-node
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: __control_plane_legacy_calico
  failed_when: false
  changed_when: false

- name: Refuse an unsafe in-place CNI replacement
  ansible.builtin.assert:
    that:
      - __control_plane_legacy_calico.rc != 0
    fail_msg: >-
      This cluster already runs Calico. Installing Cilium beside another CNI
      can strand pods and leave conflicting host routes. For this pre-workload
      homelab, reset every node as documented in this role's README and rebuild;
      use Cilium's migration procedure if the cluster contains data to preserve.
    quiet: true

- name: Read the current Cilium Helm release
  ansible.builtin.command:
    argv:
      - helm
      - list
      - --namespace
      - kube-system
      - --filter
      - ^cilium$
      - --output
      - json
      - --kubeconfig
      - "{{ playbook_dir }}/kubeconfig"
      - --kube-apiserver
      - "https://{{ ansible_host }}:6443"
  delegate_to: localhost
  become: false
  register: __control_plane_cilium_releases
  changed_when: false

- name: Select the current Cilium release
  ansible.builtin.set_fact:
    __control_plane_cilium_release: >-
      {{ (__control_plane_cilium_releases.stdout | from_json | first)
         if (__control_plane_cilium_releases.stdout | from_json | length > 0)
         else {} }}

- name: Read the current Cilium user-supplied values
  ansible.builtin.command:
    argv:
      - helm
      - get
      - values
      - cilium
      - --namespace
      - kube-system
      - --output
      - json
      - --kubeconfig
      - "{{ playbook_dir }}/kubeconfig"
      - --kube-apiserver
      - "https://{{ ansible_host }}:6443"
  delegate_to: localhost
  become: false
  when: __control_plane_cilium_release | length > 0
  register: __control_plane_cilium_values_raw
  failed_when: false
  changed_when: false

- name: Select the current Cilium values
  ansible.builtin.set_fact:
    __control_plane_cilium_current_values: >-
      {{ (__control_plane_cilium_values_raw.stdout | from_json)
         if (__control_plane_cilium_values_raw.rc | default(1) == 0
             and __control_plane_cilium_values_raw.stdout | default('') | length > 0)
         else {} }}

- name: Decide whether Cilium needs reconciliation
  ansible.builtin.set_fact:
    __control_plane_cilium_needs_reconcile: >-
      {{ __control_plane_cilium_release.status | default('') != 'deployed'
         or __control_plane_cilium_release.chart | default('') != 'cilium-' ~ cilium_version
         or __control_plane_cilium_current_values != control_plane_cilium_helm_values }}

- name: Reconcile the Cilium Helm release
  when: __control_plane_cilium_needs_reconcile
  block:
    - name: Verify the Cilium chart before reconciling an existing cluster
      ansible.builtin.include_tasks: verify_cilium_chart.yml
      when: __control_plane_admin_conf.stat.exists

    - name: Create a temporary directory for Cilium values
      ansible.builtin.tempfile:
        state: directory
        prefix: cilium-values-
      delegate_to: localhost
      become: false
      register: __control_plane_cilium_values_dir

    - name: Render the minimal Cilium values
      ansible.builtin.copy:
        dest: "{{ __control_plane_cilium_values_dir.path }}/values.yml"
        content: |
          {{ __control_plane_managed_header }}
          # Temporary Helm values; do not edit.
          {{ control_plane_cilium_helm_values | to_nice_yaml(indent=2) }}
        mode: "0600"
        backup: true
      delegate_to: localhost
      become: false

    - name: Install or upgrade Cilium from its pinned OCI digest
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - cilium
          - "oci://quay.io/cilium/charts/cilium@sha256:{{ cilium_chart_sha256 }}"
          - --namespace
          - kube-system
          - --values
          - "{{ __control_plane_cilium_values_dir.path }}/values.yml"
          - --rollback-on-failure
          - --timeout
          - 10m
          - --history-max
          - "5"
          - --kubeconfig
          - "{{ playbook_dir }}/kubeconfig"
          - --kube-apiserver
          - "https://{{ ansible_host }}:6443"
      delegate_to: localhost
      become: false
      changed_when: true

  always:
    - name: Remove the temporary Cilium values
      ansible.builtin.file:
        path: "{{ __control_plane_cilium_values_dir.path }}"
        state: absent
      delegate_to: localhost
      become: false
      when:
        - __control_plane_cilium_values_dir is defined
        - __control_plane_cilium_values_dir.path is defined

- name: Wait for the Cilium agent on this node
  ansible.builtin.command: >
    kubectl -n kube-system rollout status daemonset/cilium --timeout=300s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Wait for this node to become Ready
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=300s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

# --- Join command for the workers -----------------------------------------
- name: Check which nodes have already joined
  ansible.builtin.command: kubectl get nodes -o jsonpath='{.items[*].metadata.name}'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: __control_plane_joined_nodes
  changed_when: false

# no_log stays here: this command's entire output IS the secret. changed_when
# reflects reality — it mints server-side state (a token with a 24h TTL).
- name: Generate a worker join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: __control_plane_join_command_raw
  changed_when: __control_plane_join_command_raw.rc == 0
  no_log: true
  when: worker_hosts | difference(__control_plane_joined_nodes.stdout.split()) | length > 0

- name: Publish the join command as a fact
  ansible.builtin.set_fact:
    control_plane_join_command: "{{ __control_plane_join_command_raw.stdout }}"
  no_log: true
  when: __control_plane_join_command_raw is not skipped
