---
argument_specs:
  main:
    short_description: kubeadm init, Cilium CNI, kubeconfig distribution
    description:
      - Initialises the control plane, installs Cilium, mints a worker join token.
      - >-
        control_plane_endpoint and pod_cidr are written into the apiserver
        certificate and the CNI config here and CANNOT be changed afterwards
        without `kubeadm reset` on every node.
      - >-
        Publishes control_plane_join_command as a fact, consumed by the worker role
        through hostvars. That is this role's one outbound value.
    options:
      admin_user:
        description:
          - Human break-glass account that receives a copy of the admin kubeconfig
            at ~/.kube/config on the control-plane node.
        type: str
        required: true
      control_plane_endpoint:
        description:
          - DNS name baked into the apiserver certificate.
          - >-
            Must be a NAME, not an IP - that is what allows extra control-plane
            nodes to be added later without regenerating certificates.
        type: str
        required: true
      pod_cidr:
        description:
          - Pod network CIDR passed to kubeadm.
          - >-
            Cilium uses Kubernetes host-scope IPAM and consumes the per-node
            PodCIDRs allocated from this range. It must not overlap the home LAN.
        type: str
        required: true
      cilium_version:
        description: Cilium Helm chart version, e.g. "1.20.0".
        type: str
        required: true
      cilium_chart_sha256:
        description:
          - sha256 OCI manifest digest of the Cilium Helm chart.
          - >-
            The role installs by digest rather than mutable tag. Regenerate with
            `helm pull oci://quay.io/cilium/charts/cilium --version <version>`.
        type: str
        required: true
      control_plane_cilium_helm_values:
        description:
          - Minimal Cilium Helm values reconciled by this role.
          - >-
            Defaults retain kube-proxy, use Kubernetes host-scope IPAM and VXLAN,
            and disable optional Hubble and Envoy components.
        type: dict
        required: false
      worker_hosts:
        description:
          - Worker inventory hostnames, resolved from the inventory in group_vars.
          - >-
            Compared against live cluster membership so a join token is only minted
            when a worker actually still needs one.
        type: list
        elements: str
        required: true
