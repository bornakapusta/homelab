---
# Defaults for the automation_user role. Override in group_vars/all.yml.
# ansible_service_user: (required)
# ansible_service_pubkey: (required) path on the CONTROLLER to the public key
# ssh_allowed_from: (required) used to scope the key's from= restriction

# Restrictions applied to the automation key in authorized_keys.
#
# from= scopes the key to the networks you administer from, so a stolen key is
# useless off-LAN. Forwarding is disabled because a config-management account has
# no reason to tunnel. Do NOT add no-pty: the sudo become plugin can need one.
automation_user_key_options: >-
  from="{{ ssh_allowed_from | join(',') }}",no-port-forwarding,no-agent-forwarding,no-X11-forwarding
