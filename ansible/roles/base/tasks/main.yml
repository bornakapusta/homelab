---
# Baseline OS config, identical on every node.

- name: Set hostname to the inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Ensure hostname resolves locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ inventory_hostname }}"
    state: present

# regex_escape matters: the endpoint contains dots, which would otherwise be
# regex wildcards and could match an unrelated line. The (^|\s)…(\s|$) anchors
# match the name as a whole token, so an existing entry that carries aliases
# ("<ip> <endpoint> k8s") is updated rather than duplicated.
- name: Make the control-plane endpoint resolvable on every node
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '(^|\s){{ control_plane_endpoint | regex_escape }}(\s|$)'
    line: "{{ hostvars[control_plane_host].ansible_host }} {{ control_plane_endpoint }}"
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: safe

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

# Clock skew breaks etcd and TLS certificates — non-negotiable for a cluster.
- name: Enable time synchronisation
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started

- name: Remove packages left behind by upgrades
  ansible.builtin.apt:
    autoremove: true

# --- WiFi stability --------------------------------------------------------
# Linux WiFi cards sleep between packets, which causes latency spikes and
# brief dropouts. On a cluster that shows up as nodes flapping Ready/NotReady
# and pods being evicted for no real reason. Harmless no-op on wired nodes.
- name: Install unit to disable WiFi power saving
  ansible.builtin.copy:
    dest: /etc/systemd/system/wifi-no-powersave.service
    owner: root
    group: root
    mode: "0644"
    # No backup: here, deliberately — unlike the other managed files, this one
    # lives in a directory systemd scans for units, and a stray
    # wifi-no-powersave.service.<pid>.<date>~ makes systemd log a parse warning on
    # every daemon-reload. There is nothing to break-glass into on this file
    # anyway; it is generated wholesale from the content below.
    content: |
      {{ __base_managed_header }}
      [Unit]
      Description=Disable WiFi power saving (cluster stability)
      After=network.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/bin/sh -c 'for d in /sys/class/net/wl*; do [ -e "$d" ] || continue; /usr/sbin/iw dev "$(basename "$d")" set power_save off || true; done'

      [Install]
      WantedBy=multi-user.target

- name: Enable WiFi power-save-off unit
  ansible.builtin.systemd:
    name: wifi-no-powersave.service
    enabled: true
    state: started
    daemon_reload: true

# --- node DNS --------------------------------------------------------------
# The FRITZ!Box advertises the cluster-hosted home-dns (192.168.178.241) to
# every DHCP client so that *.home.arpa resolves house-wide. The nodes must not
# follow: a node resolving through a DNS server that runs on the cluster cannot
# pull images, reach apt, or bootstrap after a cold boot. Pin them to the router
# and ignore whatever DHCP/RA advertises.
#
# A drop-in beside netplan's generated .network file (networkd reads drop-in
# directories from /etc for units in /run) rather than editing netplan YAML,
# which holds the WiFi credentials and differs per node. Backups are inert:
# networkd only reads *.conf from a drop-in directory.
- name: Create networkd drop-in directories for the DNS pin
  tags: [dns]
  ansible.builtin.file:
    path: "/etc/systemd/network/10-netplan-{{ item }}.network.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ base_dns_pinned_interfaces }}"

- name: Pin node DNS to the router and ignore DHCP/RA-supplied servers
  tags: [dns]
  ansible.builtin.copy:
    dest: "/etc/systemd/network/10-netplan-{{ item }}.network.d/50-dns-pin.conf"
    owner: root
    group: root
    mode: "0644"
    backup: true
    content: |
      {{ __base_managed_header }}
      [Network]
      {% for server in node_dns_servers %}
      DNS={{ server }}
      {% endfor %}

      [DHCPv4]
      UseDNS=false

      [DHCPv6]
      UseDNS=false

      [IPv6AcceptRA]
      UseDNS=false
  loop: "{{ base_dns_pinned_interfaces }}"
  register: __base_dns_pin

# Plain task, not a handler: the verification below needs the reload to have
# happened first, and a handler here would fire wherever kubernetes_node's
# play-global flush_handlers puts it (see the note under hardware sensors).
# `networkctl reload` re-reads configuration and reconfigures only the links
# whose .network changed; the DHCP lease itself is kept.
- name: Apply the DNS pin
  tags: [dns]
  ansible.builtin.command: networkctl reload
  when: __base_dns_pin.results | selectattr('changed') | list | length > 0
  changed_when: true

- name: Read the resolver's per-link DNS servers
  tags: [dns]
  ansible.builtin.command:
    argv: [resolvectl, dns, "{{ item }}"]
  loop: "{{ base_dns_pinned_interfaces | intersect(ansible_facts.interfaces) }}"
  register: __base_link_dns
  changed_when: false
  until: >-
    (__base_link_dns.stdout.split(':', 1) | last).split()
    | difference(node_dns_servers) | length == 0
  retries: 10
  delay: 2

- name: Assert every link resolves only through the pinned servers
  tags: [dns]
  ansible.builtin.assert:
    that:
      - >-
        (item.stdout.split(':', 1) | last).split()
        | difference(node_dns_servers) | length == 0
    fail_msg: >-
      {{ item.item }} still uses DNS servers outside node_dns_servers
      ({{ node_dns_servers | join(', ') }}): {{ item.stdout }}. A node resolving
      through the cluster-hosted home-dns cannot recover from a cold boot.
    quiet: true
  loop: "{{ __base_link_dns.results }}"
  loop_control:
    label: "{{ item.item }}"

# --- hardware sensors ------------------------------------------------------
# Populate /sys/class/hwmon so temperatures are readable. This lives in `base`
# rather than `kubernetes_node` on purpose: sensing the hardware is a property
# of the machine, not a kubeadm prerequisite. These boxes should report their
# own temperature whether or not Kubernetes is ever installed on them.
#
# Consumed later by node_exporter's hwmon collector (node_hwmon_temp_celsius),
# which reads the sysfs tree directly — nothing here has to be running for that
# to work, the modules just have to be loaded.
#
# Plain tasks, no handler. `meta: flush_handlers` in the kubernetes_node role is
# play-global rather than role-scoped, so a handler added here would fire at a
# point decided by a different role — see the comment on that task.
- name: Load hardware sensor modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/sensors.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    content: |
      {{ __base_managed_header }}
      {{ base_sensor_modules | join('\n') }}

- name: Load sensor modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ base_sensor_modules }}"

# --- reboot reporting ------------------------------------------------------
# `apt upgrade` above can pull a kernel. Nothing here reboots: on a cluster you
# drain first, by hand, one node at a time. Surface the pending work so it does
# not sit unnoticed until an unrelated incident.
- name: Check whether a reboot is pending
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: __base_reboot_required

- name: Report that this node needs a manual drain and reboot
  ansible.builtin.debug:
    msg:
      - "{{ inventory_hostname }} needs a reboot (kernel or libc was upgraded)."
      - "Drain:    kubectl drain {{ inventory_hostname }} --ignore-daemonsets --delete-emptydir-data"
      - "Reboot:   ssh {{ inventory_hostname }} sudo reboot"
      - "Return:   kubectl uncordon {{ inventory_hostname }}"
      - "On the control-plane node this briefly takes the API server down."
  when: __base_reboot_required.stat.exists
