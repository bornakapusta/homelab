---
argument_specs:
  main:
    short_description: Baseline OS configuration, identical on every node
    description:
      - Hostname, timezone, chrony, apt upgrade, base packages, WiFi power-save.
      - >-
        Also a patch event - this role runs `apt upgrade`, so every application
        may pull a kernel. Nothing reboots; a pending reboot is reported instead.
    options:
      timezone:
        description: IANA timezone name applied to the node, e.g. Europe/Zagreb.
        type: str
        required: true
      control_plane_endpoint:
        description:
          - DNS name of the API server, written into /etc/hosts on every node.
          - Must be a name and not an IP; preflight asserts this.
        type: str
        required: true
      control_plane_host:
        description:
          - Inventory hostname of the control-plane node.
          - Its ansible_host becomes the address side of the /etc/hosts entry.
        type: str
        required: true
      base_packages:
        description:
          - Packages installed on every node. Each entry has a named consumer.
          - Override only to add site-specific extras; see defaults/main.yml.
        type: list
        elements: str
        required: false
