---
- name: Exercise Metrics Server validation and manifest preparation
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    metrics_server_validation_digest: >-
      aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    metrics_server_valid_cluster_hosts: [node-1, node-2, node-3]
    metrics_server_valid_worker_hosts: [node-2, node-3]
    metrics_server_validation_cases:
      - name: valid pinned three-node contract
        expect_rejected: false
      - name: malformed release version
        version: latest
        expect_rejected: true
      - name: malformed manifest digest
        manifest_digest: not-a-digest
        expect_rejected: true
      - name: malformed image digest
        image_digest: not-a-digest
        expect_rejected: true
      - name: kubelet TLS exception not acknowledged
        tls_acknowledged: false
        expect_rejected: true
      - name: kubelet port collision
        secure_port: 10250
        expect_rejected: true
      - name: port outside valid range
        secure_port: 70000
        expect_rejected: true
      - name: empty cluster host list
        cluster_nodes: []
        expect_rejected: true
      - name: duplicate cluster host
        cluster_nodes: [node-1, node-2, node-2]
        expect_rejected: true
      - name: empty worker host list
        worker_nodes: []
        expect_rejected: true
      - name: worker missing from cluster inventory
        worker_nodes: [node-2, node-4]
        expect_rejected: true
      - name: empty node name
        cluster_nodes: [node-1, node-2, '']
        expect_rejected: true
    metrics_server_source_fixture:
      - apiVersion: v1
        kind: ServiceAccount
        metadata:
          labels:
            k8s-app: metrics-server
          name: metrics-server
          namespace: kube-system
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          labels:
            k8s-app: metrics-server
          name: system:aggregated-metrics-reader
        rules: []
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          labels:
            k8s-app: metrics-server
          name: system:metrics-server
        rules: []
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          labels:
            k8s-app: metrics-server
          name: metrics-server-auth-reader
          namespace: kube-system
        roleRef: {}
        subjects: []
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          labels:
            k8s-app: metrics-server
          name: metrics-server:system:auth-delegator
        roleRef: {}
        subjects: []
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          labels:
            k8s-app: metrics-server
          name: system:metrics-server
        roleRef: {}
        subjects: []
      - apiVersion: v1
        kind: Service
        metadata:
          labels:
            k8s-app: metrics-server
          name: metrics-server
          namespace: kube-system
        spec:
          ports:
            - appProtocol: https
              name: https
              port: 443
              protocol: TCP
              targetPort: https
          selector:
            k8s-app: metrics-server
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          labels:
            k8s-app: metrics-server
          name: metrics-server
          namespace: kube-system
        spec:
          selector:
            matchLabels:
              k8s-app: metrics-server
          strategy:
            rollingUpdate:
              maxUnavailable: 0
          template:
            metadata:
              labels:
                k8s-app: metrics-server
            spec:
              containers:
                - args:
                    - --cert-dir=/tmp
                    - --secure-port=10250
                    - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
                    - --kubelet-use-node-status-port
                    - --metric-resolution=15s
                  image: registry.k8s.io/metrics-server/metrics-server:v0.9.0
                  imagePullPolicy: IfNotPresent
                  livenessProbe:
                    httpGet:
                      path: /livez
                      port: https
                      scheme: HTTPS
                  name: metrics-server
                  ports:
                    - containerPort: 10250
                      name: https
                      protocol: TCP
                  readinessProbe:
                    httpGet:
                      path: /readyz
                      port: https
                      scheme: HTTPS
                  resources:
                    requests:
                      cpu: 100m
                      memory: 200Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop: [ALL]
                    readOnlyRootFilesystem: true
                    runAsNonRoot: true
                    runAsUser: 1000
                    seccompProfile:
                      type: RuntimeDefault
                  volumeMounts:
                    - mountPath: /tmp
                      name: tmp-dir
              nodeSelector:
                kubernetes.io/os: linux
              priorityClassName: system-cluster-critical
              serviceAccountName: metrics-server
              volumes:
                - emptyDir: {}
                  name: tmp-dir
      - apiVersion: apiregistration.k8s.io/v1
        kind: APIService
        metadata:
          labels:
            k8s-app: metrics-server
          name: v1beta1.metrics.k8s.io
        spec:
          group: metrics.k8s.io
          groupPriorityMinimum: 100
          insecureSkipTLSVerify: true
          service:
            name: metrics-server
            namespace: kube-system
          version: v1beta1
          versionPriority: 100
    metrics_server_manifest_shape_cases:
      - name: missing Service
        mutation: missing_service
      - name: unexpected Deployment image
        mutation: deployment_image
      - name: unexpected Service target port
        mutation: service_target
      - name: APIService TLS mode changed
        mutation: api_tls
    metrics_server_ownership_cases:
      - name: all managed resources absent
        results:
          - item:
              resource: deployments.apps
              namespace: kube-system
              name: metrics-server
            stdout: ''
        expect_rejected: false
      - name: existing resource has the role owner
        results:
          - item:
              resource: deployments.apps
              namespace: kube-system
              name: metrics-server
            stdout: >-
              {"metadata":{"annotations":{"homelab.home.arpa/metrics-server-managed-by":"ansible-metrics-server"}}}
        expect_rejected: false
      - name: existing resource is unowned
        results:
          - item:
              resource: deployments.apps
              namespace: kube-system
              name: metrics-server
            stdout: '{"metadata":{"annotations":{}}}'
        expect_rejected: true
    metrics_server_reconcile_state_cases:
      - name: exact desired state
        rc: 0
        expect_reconcile: false
      - name: drifted or absent desired state
        rc: 1
        expect_reconcile: true
  tasks:
    - name: Run each Metrics Server input-validation case
      ansible.builtin.include_tasks: tasks/metrics_server_validation_case.yml
      loop: "{{ metrics_server_validation_cases }}"
      loop_control:
        loop_var: metrics_server_validation_case
        label: "{{ metrics_server_validation_case.name }}"

    - name: Prepare the valid parsed manifest fixture
      ansible.builtin.include_role:
        name: metrics_server
        tasks_from: prepare_manifest
        public: true
      vars:
        metrics_server_version: 0.9.0
        metrics_server_manifest_sha256: "{{ metrics_server_validation_digest }}"
        metrics_server_image_sha256: "{{ metrics_server_validation_digest }}"
        metrics_server_kubelet_insecure_tls_acknowledged: true
        metrics_server_secure_port: 4443
        metrics_server_kubeconfig: /tmp/metrics-server-validation-kubeconfig
        metrics_server_cluster_hosts: "{{ metrics_server_valid_cluster_hosts }}"
        metrics_server_worker_hosts: "{{ metrics_server_valid_worker_hosts }}"
        __metrics_server_source_objects: "{{ metrics_server_source_fixture }}"

    - name: Confirm preparation preserves upstream security and probe fields
      ansible.builtin.assert:
        that:
          - __metrics_server_desired_container.securityContext.runAsUser == 1000
          - __metrics_server_desired_container.securityContext.capabilities.drop == ['ALL']
          - __metrics_server_desired_container.livenessProbe.httpGet.path == '/livez'
          - __metrics_server_desired_container.readinessProbe.httpGet.path == '/readyz'
          - __metrics_server_desired_container.volumeMounts[0].mountPath == '/tmp'
          - __metrics_server_desired_deployment.spec.template.spec.volumes | length == 1
          - __metrics_server_desired_service.spec.type == 'ClusterIP'
          - >-
            __metrics_server_desired_deployment.spec.template.spec.serviceAccountName
            == 'metrics-server'
        fail_msg: >-
          Parsed transformation dropped an upstream security, probe, or volume
          field that the homelab contract must preserve.
        quiet: true

    - name: Render the prepared fixture through the role template
      ansible.builtin.set_fact:
        __metrics_server_rendered_fixture: >-
          {{ lookup(
               'ansible.builtin.template',
               playbook_dir ~ '/../roles/metrics_server/templates/components.yml.j2'
             ) }}

    - name: Parse the rendered fixture again
      ansible.builtin.set_fact:
        __metrics_server_rendered_fixture_objects: >-
          {{ __metrics_server_rendered_fixture | from_yaml_all | list }}

    - name: Rendering must round-trip all nine annotated objects
      ansible.builtin.assert:
        that:
          - __metrics_server_rendered_fixture_objects | length == 9
        fail_msg: >-
          The role template did not render a complete parseable object set.
        quiet: true

    - name: Every round-tripped object must retain ownership annotations
      ansible.builtin.assert:
        that:
          - >-
            item.metadata.annotations[__metrics_server_owner_annotation]
            == __metrics_server_owner_value
          - >-
            item.metadata.annotations[__metrics_server_manifest_annotation]
            == metrics_server_validation_digest
        quiet: true
      loop: "{{ __metrics_server_rendered_fixture_objects }}"
      loop_control:
        label: "{{ item.kind }}/{{ item.metadata.name }}"

    - name: Run each fail-closed manifest-shape case
      ansible.builtin.include_tasks: tasks/metrics_server_manifest_case.yml
      loop: "{{ metrics_server_manifest_shape_cases }}"
      loop_control:
        loop_var: metrics_server_manifest_shape_case
        label: "{{ metrics_server_manifest_shape_case.name }}"

    - name: Run each Metrics Server ownership-decision case
      ansible.builtin.include_tasks: tasks/metrics_server_ownership_case.yml
      loop: "{{ metrics_server_ownership_cases }}"
      loop_control:
        loop_var: metrics_server_ownership_case
        label: "{{ metrics_server_ownership_case.name }}"

    - name: Run each Metrics Server reconciliation-decision case
      ansible.builtin.include_tasks: tasks/metrics_server_reconcile_state_case.yml
      loop: "{{ metrics_server_reconcile_state_cases }}"
      loop_control:
        loop_var: metrics_server_reconcile_state_case
        label: "{{ metrics_server_reconcile_state_case.name }}"
