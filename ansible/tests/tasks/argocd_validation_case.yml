---
- name: Reset the validation outcome for {{ argocd_validation_case.name }}
  ansible.builtin.set_fact:
    argocd_validation_rejected: false

- name: Exercise validation for {{ argocd_validation_case.name }}
  block:
    - name: Run only the Argo CD validation tasks
      ansible.builtin.include_role:
        name: argocd
        tasks_from: validate
      vars:
        argocd_chart_version: >-
          {{ argocd_validation_case.chart_version | default('10.10.2') }}
        argocd_chart_sha256: >-
          {{ argocd_validation_case.chart_digest
             | default(argocd_validation_digest) }}
        argocd_version: >-
          {{ argocd_validation_case.app_version | default('3.5.4') }}
        argocd_image_sha256: >-
          {{ argocd_validation_case.image_digest
             | default(argocd_validation_digest) }}
        argocd_redis_version: >-
          {{ argocd_validation_case.redis_version | default('8.6.4-alpine') }}
        argocd_redis_image_sha256: >-
          {{ argocd_validation_case.redis_digest
             | default(argocd_validation_digest) }}
        argocd_release_name: >-
          {{ argocd_validation_case.release_name | default('argocd') }}
        argocd_root_app_name: >-
          {{ argocd_validation_case.root_app_name | default('homelab-root') }}
        argocd_hostname: >-
          {{ argocd_validation_case.hostname | default('argocd.home.arpa') }}
        argocd_ingress_class_name: >-
          {{ argocd_validation_case.ingress_class | default('traefik') }}
        argocd_root_repo_url: >-
          {{ argocd_validation_case.repo_url
             | default('https://github.com/bornakapusta/homelab.git') }}
        argocd_root_revision: >-
          {{ argocd_validation_case.revision | default('main') }}
        argocd_root_path: >-
          {{ argocd_validation_case.root_path | default('clusters/home/apps') }}
        argocd_load_balancer_ip: >-
          {{ argocd_validation_case.load_balancer_ip | default('192.168.178.242') }}
  rescue:
    - name: Record that the Argo CD safety gate rejected this case
      ansible.builtin.set_fact:
        argocd_validation_rejected: true

- name: Validation outcome must match the expected result
  ansible.builtin.assert:
    that:
      - >-
        argocd_validation_rejected | bool
        == argocd_validation_case.expect_rejected | bool
    fail_msg: >-
      {{ argocd_validation_case.name }} was expected to be
      {{ 'rejected' if argocd_validation_case.expect_rejected else 'accepted' }},
      but the Argo CD safety gate produced the opposite result.
    quiet: true
