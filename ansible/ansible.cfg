[defaults]
inventory = inventory.ini
# Host-key verification is ON. Combined with StrictHostKeyChecking=accept-new
# below, this is trust-on-first-use: an unknown node is accepted and pinned to
# ~/.ssh/known_hosts, but a CHANGED key aborts the run. That catches the
# realistic attack (someone impersonating a node you already provisioned).
#
# It does NOT verify the very first connection. To close that gap, read each
# node's fingerprint from its physical console:
#     ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub
# and compare against `ssh-keygen -lf ~/.ssh/known_hosts` on this laptop.
#
# After re-imaging a node its host key changes and runs will (correctly) fail.
# Clear the stale entry first:  ssh-keygen -R <ip>
host_key_checking = True
retry_files_enabled = False
# NOT `stdout_callback = yaml`: that short name resolves to
# community.general.yaml, which was REMOVED in community.general 12.0.0, and
# makes every ansible-playbook run abort before it starts. result_format is the
# supported replacement (ansible-core 2.13+).
stdout_callback = default
result_format = yaml
callbacks_enabled = timer
interpreter_python = auto_silent
forks = 5

[privilege_escalation]
become = True
become_method = sudo
# If your admin user needs a sudo PASSWORD (i.e. you did NOT set up the
# NOPASSWD sudoers line from the autoinstall file), leave this False and run
# playbooks with:  ansible-playbook site.yml --ask-become-pass
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
