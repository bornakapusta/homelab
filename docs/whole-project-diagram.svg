<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Whole-project architecture: from hardware up to access, with Infrastructure-as-Code driving every layer</title>
  <desc>A layered stack. Bottom: three OptiPlex nodes. Then Ubuntu OS, the kubeadm Kubernetes layer, platform services, workloads (hosted apps and the agent warm pool), and access (herdr, Tailscale, DNS hostnames). A left rail shows Infrastructure as Code — a git repo feeding cloud-init and Ansible into the OS layer and Argo CD into the platform and workload layers.</desc>
  <style>
    :root{
      --ink:#2C2C2A; --dim:#5F5E5A; --soft:#D3D1C7; --line:#B4B2A9;
      --panel:#F1EFE8; --card:#ffffff; --accent:#534AB7; --accentbg:#EEEDFE;
      --hot:#1D9E75; --hotbg:#E1F5EE;
    }
    @media (prefers-color-scheme: dark){ :root{ --ink:#ECEBE6; --dim:#B4B2A9; --soft:#444441; --line:#5F5E5A; --panel:#26261f; --card:#2C2C2A; --accent:#AFA9EC; --accentbg:#26215C; --hotbg:#085041;} }
    text{ fill:var(--ink); }
    .h{ font-size:20px; font-weight:700; }
    .band{ font-size:12px; font-weight:700; fill:var(--accent); letter-spacing:.03em; }
    .lbl{ font-size:12.5px; font-weight:600; }
    .tag{ font-size:10.5px; fill:var(--dim); }
    .bandbox{ fill:var(--panel); stroke:var(--soft); stroke-width:1.5; }
    .box{ fill:var(--card); stroke:var(--soft); stroke-width:1.5; }
    .flow{ stroke:var(--accent); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  </style>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--accent)"/></marker>
  </defs>

  <text x="28" y="34" class="h">Whole-project architecture — 3-node agent homelab</text>

  <rect x="20" y="60" width="150" height="628" rx="14" class="bandbox"/>
  <text x="34" y="84" class="band">INFRA AS CODE</text>
  <rect x="34" y="96" width="122" height="52" rx="9" fill="var(--accentbg)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="95" y="118" text-anchor="middle" class="lbl" fill="var(--accent)">git repo</text>
  <text x="95" y="135" text-anchor="middle" class="tag">single source of truth</text>
  <rect x="34" y="158" width="122" height="44" rx="9" class="box"/>
  <text x="95" y="178" text-anchor="middle" class="lbl" font-size="11.5">cloud-init</text>
  <text x="95" y="193" text-anchor="middle" class="tag">identical installs</text>
  <rect x="34" y="210" width="122" height="44" rx="9" class="box"/>
  <text x="95" y="230" text-anchor="middle" class="lbl" font-size="11.5">Ansible</text>
  <text x="95" y="245" text-anchor="middle" class="tag">fleet config ×1</text>
  <rect x="34" y="262" width="122" height="44" rx="9" class="box"/>
  <text x="95" y="282" text-anchor="middle" class="lbl" font-size="11.5">Argo CD</text>
  <text x="95" y="297" text-anchor="middle" class="tag">GitOps in-cluster</text>

  <rect x="190" y="60" width="790" height="92" rx="12" class="bandbox"/>
  <text x="204" y="80" class="band">ACCESS</text>
  <rect x="204" y="88" width="212" height="52" rx="9" fill="var(--accentbg)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="310" y="110" text-anchor="middle" class="lbl" fill="var(--accent)">You — laptop / phone</text>
  <text x="310" y="127" text-anchor="middle" class="tag">herdr · kubectl</text>
  <rect x="430" y="88" width="260" height="52" rx="9" class="box"/>
  <text x="560" y="110" text-anchor="middle" class="lbl">Tailscale mesh</text>
  <text x="560" y="127" text-anchor="middle" class="tag">remote access · Split DNS</text>
  <rect x="704" y="88" width="262" height="52" rx="9" class="box"/>
  <text x="835" y="110" text-anchor="middle" class="lbl">DNS + TLS</text>
  <text x="835" y="127" text-anchor="middle" class="tag">https://app.lab.example</text>

  <rect x="190" y="164" width="790" height="96" rx="12" class="bandbox"/>
  <text x="204" y="184" class="band">WORKLOADS</text>
  <rect x="204" y="192" width="372" height="58" rx="9" class="box"/>
  <text x="390" y="214" text-anchor="middle" class="lbl">Hosted apps</text>
  <text x="390" y="232" text-anchor="middle" class="tag">own namespaces · GitOps · quotas · NetworkPolicies</text>
  <rect x="590" y="192" width="376" height="58" rx="9" fill="var(--hotbg)" stroke="var(--hot)" stroke-width="1.5"/>
  <text x="778" y="214" text-anchor="middle" class="lbl" fill="var(--hot)">Agent warm pool</text>
  <text x="778" y="232" text-anchor="middle" class="tag">rails-dev pods · Claude Code · Codex (pre-warmed)</text>

  <rect x="190" y="272" width="790" height="104" rx="12" class="bandbox"/>
  <text x="204" y="292" class="band">PLATFORM SERVICES (in-cluster, Argo-managed)</text>
  <g class="lbl" font-size="11">
    <rect x="204" y="300" width="118" height="30" rx="7" class="box"/><text x="263" y="320" text-anchor="middle" font-size="11">Agent Sandbox</text>
    <rect x="330" y="300" width="104" height="30" rx="7" class="box"/><text x="382" y="320" text-anchor="middle" font-size="11">ingress-nginx</text>
    <rect x="442" y="300" width="92" height="30" rx="7" class="box"/><text x="488" y="320" text-anchor="middle" font-size="11">MetalLB</text>
    <rect x="542" y="300" width="104" height="30" rx="7" class="box"/><text x="594" y="320" text-anchor="middle" font-size="11">cert-manager</text>
    <rect x="654" y="300" width="104" height="30" rx="7" class="box"/><text x="706" y="320" text-anchor="middle" font-size="11">ExternalDNS</text>
    <rect x="766" y="300" width="200" height="30" rx="7" class="box"/><text x="866" y="320" text-anchor="middle" font-size="11">Grafana + Prometheus</text>
    <rect x="204" y="336" width="150" height="30" rx="7" class="box"/><text x="279" y="356" text-anchor="middle" font-size="11">local-path storage</text>
    <rect x="362" y="336" width="132" height="30" rx="7" class="box"/><text x="428" y="356" text-anchor="middle" font-size="11">metrics-server</text>
    <rect x="502" y="336" width="220" height="30" rx="7" class="box"/><text x="612" y="356" text-anchor="middle" font-size="11">Descheduler → Trimaran (later)</text>
  </g>

  <rect x="190" y="388" width="790" height="70" rx="12" class="bandbox"/>
  <text x="204" y="408" class="band">KUBERNETES (kubeadm)</text>
  <rect x="204" y="416" width="290" height="34" rx="8" class="box"/><text x="349" y="438" text-anchor="middle" class="lbl" font-size="11.5">control plane + etcd</text>
  <rect x="502" y="416" width="220" height="34" rx="8" class="box"/><text x="612" y="438" text-anchor="middle" class="lbl" font-size="11.5">Cilium CNI</text>
  <rect x="730" y="416" width="236" height="34" rx="8" class="box"/><text x="848" y="438" text-anchor="middle" class="lbl" font-size="11.5">containerd runtime</text>

  <rect x="190" y="470" width="790" height="58" rx="12" class="bandbox"/>
  <text x="204" y="490" class="band">OPERATING SYSTEM</text>
  <rect x="204" y="497" width="762" height="24" rx="7" class="box"/><text x="585" y="513" text-anchor="middle" class="tag">Ubuntu Server LTS 24.04 — hardened (SSH keys · ufw · unattended security) · LVM with separate /var · swap off</text>

  <rect x="190" y="540" width="790" height="92" rx="12" class="bandbox"/>
  <text x="204" y="560" class="band">HARDWARE</text>
  <rect x="204" y="568" width="248" height="52" rx="9" class="box"/><text x="328" y="590" text-anchor="middle" class="lbl">node-1 · OptiPlex 7050</text><text x="328" y="607" text-anchor="middle" class="tag">i5-7500T · 16 GB · 256 GB</text>
  <rect x="462" y="568" width="248" height="52" rx="9" class="box"/><text x="586" y="590" text-anchor="middle" class="lbl">node-2 · OptiPlex 7050</text><text x="586" y="607" text-anchor="middle" class="tag">i5-7500T · 16 GB · 256 GB</text>
  <rect x="718" y="568" width="248" height="52" rx="9" class="box"/><text x="842" y="590" text-anchor="middle" class="lbl">node-3 · OptiPlex 7050</text><text x="842" y="607" text-anchor="middle" class="tag">i5-7500T · 16 GB · 256 GB</text>

  <path d="M156,180 C176,180 176,499 190,499" class="flow" marker-end="url(#a2)"/>
  <text x="150" y="470" class="tag" fill="var(--accent)" text-anchor="end">cloud-init/Ansible → OS &amp; K8s</text>
  <path d="M156,284 C176,284 176,324 190,324" class="flow" marker-end="url(#a2)"/>
  <text x="150" y="300" class="tag" fill="var(--accent)" text-anchor="end">Argo → platform</text>
  <path d="M156,284 C182,284 182,220 190,220" class="flow" marker-end="url(#a2)"/>

  <text x="190" y="656" class="tag">Read bottom-up: hardware → OS → Kubernetes → platform → workloads → access. Everything on the left is code in one git repo.</text>
</svg>
