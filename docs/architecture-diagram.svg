<svg viewBox="0 0 940 900" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>How herdr, Agent Sandbox and Kubernetes work together, and how agent environments boot with warm pools</title>
  <desc>Top: your laptop runs herdr and reaches a 3-node kubeadm cluster over Tailscale; the cluster runs Argo CD, the Agent Sandbox controller with a warm pool of pods, hosted apps, and monitoring. Bottom: a lifecycle showing a template feeding a warm pool of pre-booted pods, a claim handing over a hot pod in milliseconds, an agent running inside it with herdr attached, then recycling.</desc>
  <style>
    :root{
      --ink:#2C2C2A; --dim:#5F5E5A; --line:#B4B2A9; --soft:#D3D1C7;
      --panel:#F1EFE8; --card:#ffffff; --accent:#534AB7; --accentbg:#EEEDFE;
      --hot:#1D9E75; --hotbg:#E1F5EE; --busy:#378ADD; --busybg:#E6F1FB; --warm:#D85A30; --warmbg:#FAECE7;
    }
    text{ fill:var(--ink); }
    .h{ font-size:20px; font-weight:700; }
    .zone{ font-size:13px; font-weight:700; fill:var(--accent); letter-spacing:.04em; }
    .lbl{ font-size:13px; font-weight:600; }
    .sub{ font-size:11px; fill:var(--dim); }
    .tag{ font-size:10.5px; fill:var(--dim); }
    .box{ fill:var(--card); stroke:var(--soft); stroke-width:1.5; }
    .panel{ fill:var(--panel); stroke:var(--soft); stroke-width:1.5; }
    .flow{ stroke:var(--line); stroke-width:2; fill:none; }
    .flowa{ stroke:var(--accent); stroke-width:2; fill:none; }
  </style>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--line)"/></marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--accent)"/></marker>
  </defs>

  <text x="30" y="34" class="h">Agents on Kubernetes — herdr + Agent Sandbox</text>

  <text x="30" y="66" class="zone">HOW IT FITS TOGETHER</text>

  <rect x="30" y="80" width="170" height="120" class="box" rx="10"/>
  <text x="115" y="108" text-anchor="middle" class="lbl">Your laptop / phone</text>
  <rect x="48" y="122" width="134" height="58" rx="8" fill="var(--accentbg)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="115" y="146" text-anchor="middle" class="lbl" fill="var(--accent)">herdr</text>
  <text x="115" y="164" text-anchor="middle" class="tag">one pane = one agent</text>

  <path d="M200,140 H262" class="flowa" marker-end="url(#arra)"/>
  <text x="231" y="130" text-anchor="middle" class="tag" fill="var(--accent)">Tailscale</text>
  <text x="231" y="156" text-anchor="middle" class="tag">kubectl / ssh</text>

  <rect x="266" y="80" width="644" height="330" class="panel" rx="14"/>
  <text x="286" y="104" class="lbl">kubeadm cluster · 3× OptiPlex (Ubuntu)</text>
  <text x="286" y="120" class="tag">one physical cluster · namespaces + node taints separate concerns</text>

  <rect x="286" y="134" width="150" height="66" class="box" rx="10"/>
  <text x="361" y="160" text-anchor="middle" class="lbl">Argo CD</text>
  <text x="361" y="178" text-anchor="middle" class="tag">GitOps → all state</text>

  <rect x="450" y="134" width="200" height="66" class="box" rx="10"/>
  <text x="550" y="160" text-anchor="middle" class="lbl">Agent Sandbox controller</text>
  <text x="550" y="178" text-anchor="middle" class="tag">Template · WarmPool · Claim</text>

  <rect x="664" y="134" width="226" height="66" class="box" rx="10"/>
  <text x="777" y="160" text-anchor="middle" class="lbl">Monitoring</text>
  <text x="777" y="178" text-anchor="middle" class="tag">Grafana + Prometheus</text>

  <rect x="286" y="214" width="364" height="180" rx="12" fill="var(--hotbg)" stroke="var(--hot)" stroke-width="1.5"/>
  <text x="300" y="236" class="lbl" fill="var(--hot)">SandboxWarmPool — node tainted for agents</text>
  <text x="300" y="252" class="tag">pre-booted pods kept HOT (no cold start)</text>
  <rect x="300" y="264" width="150" height="52" class="box" rx="9"/>
  <circle cx="316" cy="282" r="5" fill="var(--hot)"/>
  <text x="330" y="286" class="lbl" font-size="12">rails-dev pod</text>
  <text x="330" y="303" class="tag">Ruby+Rails+agents</text>
  <rect x="464" y="264" width="150" height="52" class="box" rx="9"/>
  <circle cx="480" cy="282" r="5" fill="var(--hot)"/>
  <text x="494" y="286" class="lbl" font-size="12">rails-dev pod</text>
  <text x="494" y="303" class="tag">warm &amp; idle</text>
  <rect x="300" y="326" width="150" height="52" class="box" rx="9"/>
  <circle cx="316" cy="344" r="5" fill="var(--busy)"/>
  <text x="330" y="348" class="lbl" font-size="12">rails-dev pod</text>
  <text x="330" y="365" class="tag">claimed · agent working</text>
  <rect x="464" y="326" width="150" height="52" class="box" rx="9"/>
  <text x="539" y="349" text-anchor="middle" class="tag">…pool refills to N</text>

  <rect x="664" y="214" width="226" height="180" rx="12" fill="var(--card)" stroke="var(--soft)" stroke-width="1.5"/>
  <text x="678" y="236" class="lbl">Hosted apps</text>
  <text x="678" y="252" class="tag">separate namespaces</text>
  <rect x="678" y="262" width="198" height="34" class="box" rx="8"/>
  <text x="688" y="284" class="tag">your long-running services</text>
  <rect x="678" y="304" width="198" height="34" class="box" rx="8"/>
  <text x="688" y="326" class="tag">quotas · NetworkPolicies</text>
  <rect x="678" y="346" width="198" height="34" class="box" rx="8"/>
  <text x="688" y="368" class="tag">ingress-nginx · MetalLB</text>

  <path d="M182,168 C182,420 250,352 298,352" class="flowa" marker-end="url(#arra)"/>
  <text x="150" y="360" class="tag" fill="var(--accent)">herdr kubectl exec</text>
  <text x="150" y="374" class="tag" fill="var(--accent)">into the pod</text>

  <text x="30" y="470" class="zone">HOW AN AGENT ENVIRONMENT BOOTS  (warmups)</text>

  <rect x="30" y="486" width="170" height="78" class="box" rx="10"/>
  <text x="115" y="512" text-anchor="middle" class="lbl">1 · SandboxTemplate</text>
  <text x="115" y="530" text-anchor="middle" class="tag">rails-dev image:</text>
  <text x="115" y="545" text-anchor="middle" class="tag">code + agents baked in</text>
  <path d="M200,525 H236" class="flow" marker-end="url(#arr)"/>

  <rect x="238" y="486" width="196" height="78" rx="10" fill="var(--hotbg)" stroke="var(--hot)" stroke-width="1.5"/>
  <text x="336" y="512" text-anchor="middle" class="lbl" fill="var(--hot)">2 · WarmPool keeps N HOT</text>
  <text x="336" y="530" text-anchor="middle" class="tag">pods pre-booted &amp; waiting</text>
  <text x="336" y="545" text-anchor="middle" class="tag">= no cold start</text>
  <path d="M434,525 H470" class="flow" marker-end="url(#arr)"/>

  <rect x="472" y="486" width="196" height="78" class="box" rx="10"/>
  <text x="570" y="512" text-anchor="middle" class="lbl">3 · SandboxClaim</text>
  <text x="570" y="530" text-anchor="middle" class="tag">you ask for an env →</text>
  <text x="570" y="545" text-anchor="middle" class="tag">hot pod handed over in ms</text>
  <path d="M668,525 H704" class="flow" marker-end="url(#arr)"/>

  <rect x="706" y="486" width="204" height="78" rx="10" fill="var(--busybg)" stroke="var(--busy)" stroke-width="1.5"/>
  <text x="808" y="512" text-anchor="middle" class="lbl" fill="var(--busy)">4 · Agent runs in pod</text>
  <text x="808" y="530" text-anchor="middle" class="tag">Claude Code / Codex</text>
  <text x="808" y="545" text-anchor="middle" class="tag">on your project</text>

  <path d="M808,564 V596 H570 V612" class="flowa" marker-end="url(#arra)"/>

  <rect x="472" y="614" width="196" height="72" rx="10" fill="var(--accentbg)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="570" y="640" text-anchor="middle" class="lbl" fill="var(--accent)">5 · herdr attaches</text>
  <text x="570" y="658" text-anchor="middle" class="tag">kubectl exec → live terminal</text>
  <text x="570" y="673" text-anchor="middle" class="tag">watch working / done</text>
  <path d="M472,650 H298" class="flow" marker-end="url(#arr)"/>

  <rect x="30" y="614" width="264" height="72" rx="10" fill="var(--warmbg)" stroke="var(--warm)" stroke-width="1.5"/>
  <text x="162" y="640" text-anchor="middle" class="lbl" fill="var(--warm)">6 · Done → pod recycled</text>
  <text x="162" y="658" text-anchor="middle" class="tag">claim deleted, env destroyed</text>
  <text x="162" y="673" text-anchor="middle" class="tag">WarmPool refills → back to step 2</text>

  <path d="M162,614 V590 H336 V566" class="flow" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="230" y="583" text-anchor="middle" class="tag">refill loop</text>

  <g transform="translate(30,724)">
    <text x="0" y="0" class="tag" font-weight="700">State:</text>
    <circle cx="60" cy="-4" r="5" fill="var(--hot)"/><text x="72" y="0" class="tag">warm / idle</text>
    <circle cx="168" cy="-4" r="5" fill="var(--busy)"/><text x="180" y="0" class="tag">claimed / working</text>
    <circle cx="300" cy="-4" r="5" fill="var(--warm)"/><text x="312" y="0" class="tag">recycling</text>
    <text x="392" y="0" class="tag">— "warmups" = the WarmPool keeping pre-booted pods ready so agents start instantly.</text>
  </g>
</svg>
