# Rancher — web UI for browsing and operating the cluster.
# Open https://192.168.178.243 (own MetalLB IP) or https://rancher.home.arpa.
#
# Sync wave 1: needs cert-manager's CRDs (wave 0). Until they exist the chart
# renders a warning instead of the Issuer, so the retry below covers a cold
# bootstrap where both appear in the same root sync.
#
# Version: Rancher 2.15.1+ is the first line certified for Kubernetes 1.36
# (chart kubeVersion "< 1.37.0-0"). Re-check the SUSE support matrix before
# bumping either Rancher or kubernetes_minor in ansible/group_vars/all.yml.
#
# OWNERSHIP: Rancher's UI can edit anything. Treat it as READ-ONLY for objects
# owned by Ansible (kube-system, metallb-system, traefik-system, local-path,
# argocd) or by Argo CD (everything under clusters/). An edit made in Rancher
# is either reverted by Argo CD's selfHeal or silently drifts from git.
# Rancher's bundled Fleet stays idle: no GitRepo objects are ever created.
#
# Login: the first admin password is generated by Rancher itself, never kept
# in git. Read it with:
#   kubectl -n cattle-system get secret bootstrap-secret \
#     -o go-template='{{.data.bootstrapPassword|base64decode}}{{"\n"}}'
#
# Pins: exact chart version. The server and hook images are digest-pinned via
# the tag field ("<tag>@sha256:<digest>" is a valid image reference). Rancher
# deploys further system charts at runtime (rancher-webhook, Fleet, ...) whose
# images it chooses itself; those are pinned only by the Rancher version.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rancher
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://releases.rancher.com/server-charts/stable
    chart: rancher
    targetRevision: 2.15.2
    helm:
      valuesObject:
        hostname: rancher.home.arpa
        replicas: 1
        image:
          tag: v2.15.2@sha256:0c3d8e5702555b2bfd2ec3fe7a6e5f95484a28fcb9787c498db3e5b0f62652ea
        postDelete:
          image:
            tag: v0.8.2@sha256:1eeed72d4eda486de13403c4ae6e9d29a0842edc35d0f4a8fb7b0dab79d04be9
        preUpgrade:
          image:
            tag: v0.8.2@sha256:1eeed72d4eda486de13403c4ae6e9d29a0842edc35d0f4a8fb7b0dab79d04be9
        # Its own LAN address, so the UI opens by IP with no DNS:
        # https://192.168.178.243 (Rancher's own self-signed cert on 443).
        # `hostname` above stays the server URL Rancher records; the Ingress
        # keeps the name route for when *.home.arpa resolves again.
        service:
          type: LoadBalancer
          annotations:
            metallb.io/address-pool: lan-pool
            metallb.io/loadBalancerIPs: 192.168.178.243
        ingress:
          ingressClassName: traefik
          tls:
            # Rancher-generated self-signed CA via cert-manager. Browsers warn
            # until a trusted local CA exists (PROJECT-PLAN Phase 2.75).
            source: rancher
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            memory: 4Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: cattle-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
