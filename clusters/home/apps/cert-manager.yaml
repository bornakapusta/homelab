# cert-manager — issues the Let's Encrypt certificates Traefik serves for
# *.homelab.rubylabs.co (issuers: clusters/home/manifests/cert-issuers/).
#
# Sync wave 0: the ClusterIssuers and every Ingress's Certificate are
# cert-manager objects, so the CRDs must exist before wave 1 renders.
#
# Pins: the chart version is exact, and every image is selected by digest
# (multi-arch index digest from `docker buildx imagetools inspect <image>`).
# Bump the chart and all four digests together.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.2
    helm:
      valuesObject:
        crds:
          enabled: true
          keep: true
        image:
          digest: sha256:70f532fd9cfde0b09d55687200942399d89838bc2d5d5b45152eb799a15912b8
        webhook:
          image:
            digest: sha256:a60e2dac46dbb8a7f3df95c54ce941012f54c2fe022f0ee55aaa1ab40ed957ae
        cainjector:
          image:
            digest: sha256:c85268c64f2e0e76684bf5fe8906caff34b82523561c6affe0fae3546bd87562
        startupapicheck:
          image:
            digest: sha256:46e75b6866359ffb5d82624f41e3ed1c70b2994982702ced547ce5edb418a8f5
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
