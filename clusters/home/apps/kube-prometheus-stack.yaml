# kube-prometheus-stack — Prometheus + Grafana for node and cluster resources
# (CPU, memory, disk, network, temperatures via node-exporter's hwmon collector,
# which reads the sensor modules the Ansible base role loads).
#
# Placement: Prometheus, Grafana, the operator and kube-state-metrics are pinned
# to monitoring_host (node-3), never the control plane. That name is repeated
# from ansible/group_vars/all.yml (Argo CD cannot read Ansible vars) — change
# both together. node-exporter is a DaemonSet on every node, control plane
# included.
#
# Networking: Prometheus uses hostNetwork, so its scrapes of node-exporter
# (:9100) and the kubelets (:10250) on other nodes leave from node-3's LAN
# address, which UFW already trusts. No kubelet port is opened to the Pod
# network. The hardening role opens only 9090 on node-3 to the Pod CIDR, for
# Grafana's datasource.
#
# Scope (first round): dashboards only. Alertmanager is disabled; alert rules
# still evaluate in Prometheus and show on its /alerts page. kubeadm binds etcd,
# kube-scheduler, kube-controller-manager and kube-proxy metrics to 127.0.0.1,
# so those scrapes and their rule groups are disabled rather than left
# permanently down/firing.
#
# Storage: Prometheus TSDB on a local-path PVC on node-3 (needs the
# local_path_provisioner role / default StorageClass). Retention is capped by
# both time and size for the 256 GB NVMe.
#
# Grafana login: user "admin", password generated by the chart on first sync
# and then frozen (ignoreDifferences below). Read it with:
#   kubectl -n monitoring get secret kube-prometheus-stack-grafana \
#     -o go-template='{{index .data "admin-password"|base64decode}}{{"\n"}}'
#
# Pins: exact chart version; every image selected by multi-arch index digest
# (`docker buildx imagetools inspect <image>`). Bump the chart and every digest
# together — `helm template` the new chart and diff its image list first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.3.0
    helm:
      valuesObject:
        defaultRules:
          rules:
            alertmanager: false
            etcd: false
            kubeControllerManager: false
            kubeProxy: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
            windows: false

        alertmanager:
          enabled: false

        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeProxy:
          enabled: false

        prometheusOperator:
          nodeSelector:
            kubernetes.io/hostname: node-3
          # The validating/mutating webhooks need a cert-generation hook job
          # and a webhook port reachable from the API server; not worth it for
          # a single-user cluster where rules are only ever changed through git.
          admissionWebhooks:
            enabled: false
          tls:
            enabled: false
          image:
            sha: 7c88d4e7bae63bd8d0f8da986054337c23b4472fa8d3c6817f5bc4b8407a2d6a
          prometheusConfigReloader:
            image:
              sha: 06b52bd4dbe3ed6dd5905aadaf8b9987d9da4c31d37bb86deaadae68cee2d26b

        prometheus:
          prometheusSpec:
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            nodeSelector:
              kubernetes.io/hostname: node-3
            image:
              sha: b2a413d5a03ea6a76782a508d1c7947440bba3b973931a25676e278431891b01
            retention: 15d
            retentionSize: 15GB
            # Pick up ServiceMonitors/PodMonitors/rules from any namespace,
            # not only ones labelled for this Helm release.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 3Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 20Gi

        grafana:
          nodeSelector:
            kubernetes.io/hostname: node-3
          image:
            sha: 202e5d5b3f8499e70ccac7991eea6d7da72d2790eb2e0597e7987acf724e7180
          sidecar:
            image:
              sha: 092dbe0c335fba9af414a27630ca68f34df6185784fa847d9954187e69dbfdd7
          testFramework:
            enabled: false
          # Dashboards and datasources are provisioned from ConfigMaps on every
          # start, so Grafana itself needs no persistent volume.
          persistence:
            enabled: false
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - grafana.home.arpa
            # No secretName: Traefik serves its default self-signed cert on 443
            # until a trusted local CA exists (PROJECT-PLAN Phase 2.75).
            tls:
              - hosts:
                  - grafana.home.arpa

        kube-state-metrics:
          nodeSelector:
            kubernetes.io/hostname: node-3
          image:
            sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b

        prometheus-node-exporter:
          image:
            digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # The chart generates a random admin password on every render, and stamps a
  # checksum of that Secret onto the Grafana pod template. Without both
  # entries, every sync would rotate the password and roll Grafana, and the app
  # would never settle in Synced.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: kube-prometheus-stack-grafana
      jsonPointers:
        - /data
    - group: apps
      kind: Deployment
      name: kube-prometheus-stack-grafana
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Prometheus CRDs exceed the 256 KiB client-side apply annotation.
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
